name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install
        working-directory: js
        run: pnpm install --frozen-lockfile

      - name: Validate schemas
        working-directory: js
        run: pnpm exec ajv compile --spec=draft2020
          -s ../schemas/agent-config.schema.json
          -s ../schemas/message.schema.json
          -s ../schemas/transcript.schema.json
          -s ../schemas/websocket-event.schema.json
          -s ../schemas/plugin-manifest.schema.json
          -s ../schemas/api-error.schema.json

      - name: Check
        working-directory: js
        run: pnpm check

      - name: Build
        working-directory: js
        run: pnpm build

      - name: Pack smoke
        working-directory: js
        run: pnpm pack:smoke

      - name: Test
        working-directory: js
        run: pnpm test

      - name: Lint
        working-directory: js
        run: pnpm lint
